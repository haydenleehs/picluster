# Input file for npb_is.sbatch (plain bash variables)
# IS has no input file of its own: the problem size (class) is fixed when it is built.
CLASS=B                           # A = quick test, B = normal, C = big (only with 4 nodes, e.g. 4:4 4:16)
CONFIGS="1:1 1:4 2:2 4:4 4:16"    # nodes:ranks, run in this order. Ranks must be 1, 2, 4, 8 or 16.
REPEATS=3                         # runs per config, to see run-to-run variation
