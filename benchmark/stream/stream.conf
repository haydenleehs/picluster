# Input file for build_stream.sh and stream.sbatch (plain bash variables)
# ARRAY_SIZE and NTIMES are compiled into the binary, so re-run build_stream.sh after changing them.
ARRAY_SIZE=20000000   # elements per array; 3 arrays of 8-byte doubles (20M = 480 MB total). Must be far bigger than the 1 MB cache.
NTIMES=20             # iterations per kernel; STREAM reports the best one (it ignores the first)
THREADS="1 2 4"       # OpenMP thread counts to test on each node
REPEATS=3             # runs per thread count, to see run-to-run variation
